name: Android checks

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, lint, and unit tests
        run: bash gradlew :app:assembleDevelopmentDebug :app:assembleStagingRelease :app:assembleProductionRelease :app:lintDevelopmentDebug :app:testDevelopmentDebugUnitTest :core:data:test --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            app/build/reports/
            core/data/build/reports/
